// ============ 工具函数 ============
function formatMoney(raw) {
  if (!raw || !raw.trim()) return '0元';
  const t = raw.trim();
  if (t.includes('元')) return t;
  if (/^-?\d+(\.\d+)?$/.test(t)) return t + '元';
  return t;
}
function formatMoneyNoUnit(raw) {
  if (!raw || !raw.trim()) return '0';
  return raw.trim();
}
function getVal(id) { const el = document.getElementById(id); return el ? el.value.trim() : ''; }
function setVal(id, v) { const el = document.getElementById(id); if (el) el.value = v; }
async function copyOutput(outputId) {
  const el = document.getElementById(outputId);
  if (!el) return;
  const text = el.textContent || '';
  if (!text.trim() || el.querySelector('.placeholder-note')) { alert('请先生成内容再复制'); return; }
  try { await navigator.clipboard.writeText(text); }
  catch(e) {
    const ta = document.createElement('textarea'); ta.value = text;
    document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
  }
}

// ============ 板块路由 ============
function getSectionHTML(type, subType) {
  if (type === 'ticket') return getTicketHTML();
  if (type === 'deposit') {
    if (subType === 'paimian') return getDepositPaimianHTML();
    if (subType === 'receipt') return getDepositReceiptHTML();
    return '<div class="form-section active" style="text-align:center;padding:2rem;"><p style="color:#8b7a6b;">请在上方选择存单类型</p></div>';
  }
  if (type === 'recharge') {
    if (subType === 'ghost') return getRechargeGhostHTML();
    if (subType === 'butterfly') return getRechargeButterflyHTML();
    if (subType === 'bear') return getRechargeBearHTML();
    if (subType === 'kuromi') return getRechargeKuromiHTML();
    return '<div class="form-section active" style="text-align:center;padding:2rem;"><p style="color:#8b7a6b;">请在上方选择充值款式</p></div>';
  }
  if (type === 'birthday') {
    if (subType === 'girl') return getBirthdayGirlHTML();
    if (subType === 'boy') return getBirthdayBoyHTML();
    return '<div class="form-section active" style="text-align:center;padding:2rem;"><p style="color:#8b7a6b;">请在上方选择生日类型</p></div>';
  }
  if (type === 'thanks') return getThanksHTML();
  return '';
}

function renderSection(type, subType) {
  document.getElementById('sectionsContainer').innerHTML = getSectionHTML(type, subType);
  if (type === 'ticket') document.getElementById('ticketGenderContent').innerHTML = getTicketFemaleForm();
}

function selectMainType(type) {
  currentMainType = type; currentSubType = null;
  document.querySelectorAll('.type-card').forEach(c=>c.classList.remove('active'));
  document.querySelector(`.type-card[data-type="${type}"]`).classList.add('active');
  const sub = document.getElementById('subSelector'); sub.innerHTML=''; sub.style.display='none';
  if (type === 'deposit') {
    sub.style.display='flex'; sub.innerHTML='<div class="sub-card active" data-sub="paimian" onclick="selectSubType(\'deposit\',\'paimian\',this)">💗 排面</div><div class="sub-card" data-sub="receipt" onclick="selectSubType(\'deposit\',\'receipt\',this)">🧾 存单小票</div>';
    currentSubType='paimian'; renderSection('deposit','paimian');
  } else if (type === 'recharge') {
    sub.style.display='flex'; sub.innerHTML='<div class="sub-card active" data-sub="ghost" onclick="selectSubType(\'recharge\',\'ghost\',this)">👻 小幽灵款</div><div class="sub-card" data-sub="butterfly" onclick="selectSubType(\'recharge\',\'butterfly\',this)">🦋 蝴蝶款</div><div class="sub-card" data-sub="bear" onclick="selectSubType(\'recharge\',\'bear\',this)">🧸 黄油小熊款</div><div class="sub-card" data-sub="kuromi" onclick="selectSubType(\'recharge\',\'kuromi\',this)">💜 库洛米款</div>';
    currentSubType='ghost'; renderSection('recharge','ghost');
  } else if (type === 'birthday') {
    sub.style.display='flex'; sub.innerHTML='<div class="sub-card active" data-sub="girl" onclick="selectSubType(\'birthday\',\'girl\',this)">🎀 女宝</div><div class="sub-card" data-sub="boy" onclick="selectSubType(\'birthday\',\'boy\',this)">🧊 男宝</div>';
    currentSubType='girl'; renderSection('birthday','girl');
  } else { renderSection(type, null); }
}

function selectSubType(mainType, subType, btn) {
  currentSubType = subType;
  btn.parentElement.querySelectorAll('.sub-card').forEach(c=>c.classList.remove('active'));
  btn.classList.add('active');
  renderSection(mainType, subType);
}

function goBackToMain() {
  currentMainType=null; currentSubType=null;
  document.querySelectorAll('.type-card').forEach(c=>c.classList.remove('active'));
  document.getElementById('subSelector').style.display='none';
  document.getElementById('subSelector').innerHTML='';
  document.getElementById('sectionsContainer').innerHTML='';
}

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, maximum-scale=1.5">
  <title>存单 · 幸运星俱乐部</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: linear-gradient(135deg,#fdf6f0 0%,#f5efe8 50%,#faf5f0 100%); font-family: system-ui,'Segoe UI',Roboto,'Helvetica Neue','Noto Sans','PingFang SC','Microsoft YaHei',sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 1.5rem; margin: 0; }
    .card { max-width: 780px; width: 100%; background: #fff; border-radius: 2.5rem; box-shadow: 0 25px 45px rgba(0,0,0,0.08); padding: 2rem 2rem 2.2rem; border: 1px solid #ede7e0; }
    h1 { font-size: 1.8rem; font-weight: 650; color: #3b2e24; display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.3rem; }
    .subtitle { font-size: 0.9rem; color: #8b7a6b; margin-bottom: 1.5rem; }
    .section-header { display: flex; align-items: center; gap: 0.8rem; margin-bottom: 1.4rem; padding-bottom: 0.9rem; border-bottom: 2px dashed #e8ddd0; }
    .section-header .section-icon { font-size: 1.8rem; }
    .section-header .section-title { font-size: 1.2rem; font-weight: 650; color: #3b2e24; }
    .back-btn { margin-left: auto; background: transparent; border: 1.5px solid #d6c7b8; padding: 0.45rem 1.1rem; border-radius: 2rem; font-size: 0.85rem; color: #5e4e3c; cursor: pointer; text-decoration: none; display: flex; align-items: center; gap: 0.3rem; }
    .back-btn:hover { background: #ede3d8; border-color: #b39274; }
    .sub-selector { display: flex; gap: 0.8rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
    .sub-card { padding: 0.8rem 1.4rem; border-radius: 2rem; text-align: center; cursor: pointer; transition: all 0.25s; border: 2px solid #e8ddd0; background: #fdfaf7; font-weight: 550; font-size: 0.9rem; color: #5e4e3c; }
    .sub-card:hover { border-color: #b39274; background: #fef9f4; }
    .sub-card.active { border-color: #b39274; background: #f0e2d4; color: #3b2e24; }
    .form-grid { display: flex; flex-direction: column; gap: 1rem; margin-bottom: 1.5rem; }
    .form-row { display: flex; flex-wrap: wrap; gap: 1rem; }
    .form-row .input-group { flex: 1 1 calc(50% - 0.5rem); }
    .input-group { display: flex; flex-direction: column; gap: 0.35rem; }
    label { font-size: 0.85rem; font-weight: 550; color: #5e4e3c; }
    input { width: 100%; padding: 0.8rem 1.1rem; border: 1.5px solid #e0d6cc; border-radius: 1.3rem; font-size: 0.95rem; background: #fcfaf8; color: #2e241a; }
    input:focus { outline: none; border-color: #b39274; box-shadow: 0 0 0 4px rgba(179,146,116,0.12); background: #fff; }
    .button-row { display: flex; flex-wrap: wrap; gap: 0.8rem; margin: 0.5rem 0 1.5rem; }
    .btn { background: #f0ebe4; border: none; padding: 0.75rem 1.6rem; border-radius: 2.5rem; font-weight: 550; font-size: 0.9rem; color: #4d3a2c; cursor: pointer; }
    .btn-primary { background: #b39274; color: white; }
    .btn-primary:hover { background: #9e7d60; }
    .btn:hover { background: #e5d9cc; }
    .output-box { background: #faf8f5; border: 1.5px solid #e2d6ca; border-radius: 1.5rem; padding: 1.3rem 1.4rem; font-family: 'SF Mono','Cascadia Code',monospace; font-size: 0.9rem; line-height: 1.6; white-space: pre-wrap; word-break: break-word; color: #2e241a; min-height: 150px; max-height: 400px; overflow-y: auto; }
    .placeholder-note { color: #b9a18b; font-style: italic; }
    .output-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.6rem; }
    .output-header span { font-weight: 600; color: #3b2e24; }
    .copy-btn { background: transparent; border: 1px solid #d6c7b8; padding: 0.4rem 1rem; border-radius: 2rem; font-size: 0.8rem; color: #5e4e3c; cursor: pointer; }
    .copy-btn:hover { background: #ede3d8; }
    hr { border: 0.5px solid #e3d9ce; margin: 1rem 0 0.6rem; }
    .footer-note { font-size: 0.7rem; color: #b9a18b; text-align: right; line-height: 1.5; }
    @media (max-width:600px){ .card{padding:1.3rem} .form-row{flex-direction:column} .btn{width:100%} }
  </style>
</head>
<body>
  <div class="card">
    <h1>💾 存单</h1>
    <div class="subtitle">幸运星俱乐部 · 客服专属工具</div>
    <div class="section-header"><span class="section-icon" id="secIcon">💗</span><span class="section-title" id="secTitle">存单 · 排面</span><a class="back-btn" href="index.html">↩ 返回首页</a></div>
    <div class="sub-selector" id="subBtns">
      <div class="sub-card active" data-sub="paimian" onclick="switchSub('paimian',this)">💗 排面</div>
      <div class="sub-card" data-sub="receipt" onclick="switchSub('receipt',this)">🧾 存单小票</div>
    </div>
    <div id="formContent"></div>
    <hr>
    <div class="footer-note">幸运星俱乐部 · 客服专属工具<br>Github·Kuromimiyi316，盗名必究</div>
  </div>
  <script>
    function getVal(id){ const el=document.getElementById(id); return el?el.value.trim():''; }
    function setVal(id,v){ const el=document.getElementById(id); if(el)el.value=v; }
    async function copyOutput(oid){ const el=document.getElementById(oid); if(!el)return; const t=el.textContent||''; if(!t.trim()||el.querySelector('.placeholder-note')){alert('请先生成');return;} try{await navigator.clipboard.writeText(t);}catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);} }
    function pF(){ return `<div class="form-grid"><div class="form-row"><div class="input-group"><label>❏ 板板名称</label><input id="dBoss" placeholder="自定义"></div><div class="input-group"><label>❏ 存单陪陪</label><input id="dCompanion" placeholder="自定义"></div></div><div class="form-row"><div class="input-group"><label>❏ 存单项目</label><input id="dProject" placeholder="自定义"></div><div class="input-group"><label>❏ 存单时间</label><input id="dDate" placeholder="自定义"></div></div></div><div class="button-row"><button class="btn btn-primary" onclick="genP()">✨ 生成</button><button class="btn" onclick="clearP()">🧹 清空</button></div><div class="output-section"><div class="output-header"><span>📄 输出</span><button class="copy-btn" onclick="copyOutput('dOutput')">📋 复制</button></div><div class="output-box" id="dOutput"><span class="placeholder-note">尚未生成</span></div></div>`; }
    function rF(){ return `<div class="form-grid"><div class="form-row"><div class="input-group"><label>εïз 老板昵称</label><input id="dBoss" placeholder="自定义"></div><div class="input-group"><label>εïз 陪玩昵称</label><input id="dCompanion" placeholder="自定义"></div></div><div class="form-row"><div class="input-group"><label>εïз 单子类型</label><input id="dType" placeholder="自定义"></div><div class="input-group"><label>εïз 单子数量</label><input id="dCount" placeholder="自定义"></div></div><div class="form-row"><div class="input-group"><label>εïз 单子金额</label><input id="dAmount" placeholder="自定义"></div><div class="input-group"><label>εïз 下单日期</label><input id="dDate" placeholder="自定义"></div></div><div class="input-group"><label>👑 存单注意事项</label><input id="dNote" placeholder="自定义"></div></div><div class="button-row"><button class="btn btn-primary" onclick="genR()">✨ 生成</button><button class="btn" onclick="clearR()">🧹 清空</button></div><div class="output-section"><div class="output-header"><span>📄 输出</span><button class="copy-btn" onclick="copyOutput('dOutput')">📋 复制</button></div><div class="output-box" id="dOutput"><span class="placeholder-note">尚未生成</span></div></div>`; }
    function genP(){ document.getElementById('dOutput').textContent=`                     ᕱ ⑅ ᕱ      \n┏ ⋆ づ(｡•ꈊ•｡)づ ⋆  ::::ʚ 💗 ɞ:: \n┃   ❏ 板板名称：${getVal('dBoss')||'自定义'}           \n┃   ❏ 存单陪陪：${getVal('dCompanion')||'自定义'}          \n┃   ❏ 存单项目：${getVal('dProject')||'自定义'}           \n┃   ❏ 存单时间：${getVal('dDate')||'自定义'}            \n┗ ʚ  💞 ɞ ::::::::::::::::::::::::::::::::\n  🏩 温馨提示                                  \n◌ 存单有效7天，请尽快安排\n◌ 幸运星俱乐部祝板宝玩的开心！`; }
    function clearP(){ 'dBoss,dCompanion,dProject,dDate'.split(',').forEach(id=>setVal(id,'')); document.getElementById('dOutput').innerHTML='<span class="placeholder-note">尚未生成</span>'; }
    function genR(){ document.getElementById('dOutput').textContent=`ᖰ⌯存单小票⌯ᖳ ▷ı||ıı|ı|"XYX🄲🄻🅄🄱\n              ┊                   ┊\n          :¨ ·.· ¨:¨ ·.· ¨:¨ ·.· ¨:\n          \`·.🫧˖\`· . ♪︎ ˖ \`· .💒˖𖤐  \nεïз老板昵称:${getVal('dBoss')||'自定义'}\nεïз陪玩昵称:${getVal('dCompanion')||'自定义'}\nεïз单子类型:${getVal('dType')||'自定义'}\nεïз单子数量:${getVal('dCount')||'自定义'}\nεïз单子金额:${getVal('dAmount')||'自定义'}\nεïз下单日期:${getVal('dDate')||'自定义'}\n👑存单注意事项：${getVal('dNote')||'自定义'}\n👑存单期限为七天\nʚ祝板板在幸运星玩的开心`; }
    function clearR(){ 'dBoss,dCompanion,dType,dCount,dAmount,dDate,dNote'.split(',').forEach(id=>setVal(id,'')); document.getElementById('dOutput').innerHTML='<span class="placeholder-note">尚未生成</span>'; }
    function switchSub(sub,btn){
      document.querySelectorAll('#subBtns .sub-card').forEach(c=>c.classList.remove('active'));
      btn.classList.add('active');
      if(sub==='paimian'){ document.getElementById('secIcon').textContent='💗'; document.getElementById('secTitle').textContent='存单 · 排面'; document.getElementById('formContent').innerHTML=pF(); }
      else{ document.getElementById('secIcon').textContent='🧾'; document.getElementById('secTitle').textContent='存单 · 存单小票'; document.getElementById('formContent').innerHTML=rF(); }
    }
    document.getElementById('formContent').innerHTML=pF();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>

  <style>

      `   ⪧  ❄️  ˗          ⪩ ⪨   𖦁      ˗  ❄️  ⪦\n     ᛝ      ⏜     ◜◝ ◜◝ ◜◝     ⏜     ᛝ\n           ┆       XYX 𝐂𝐋𝐔𝐁      ┆\n       𓏼 𖤐 𓏼    𓏴 ┈  🤍  ┈ 𓏴    𓏼 𖤐 𓏼\n\n📎 🧷    愿望是全世界长满蛋糕\n   ┊   ◜◝ ◜◝ ◜◝ ◜◝◜◝ ◜◝ ◜◝ ◜◝ \n𝕃𝕆𝕍𝔼  ⊹   𓏵   ⊹   ${boss} 生日快乐\n🧊    ⟍ ⏔  ⏔    𓏥    ⏔  ⏔ ⟋    🧊\n欢迎参加 ${boss} の生日会 ⋯ ⋯ ⋯\n\n  ⨯⨯   ⨯⨯  ⣀⣀⡞⠋⠳⣞⠉⠟⠛⡆幸福+1\n  ⠀⠀⢀⣠⡞⠁⠀⠀⠀⢀⣿⣶⡤⡴⠷⢲⣄  🤍\n⠀  ⡴⠋⢠⣷⣄⡀⠀⢀⡼⣇⡈⣠⣏⣀⣼⡅⠙⢦⠀\n  ⢸⡃⠰⣤⣀⠙⠩⠟⠛⠒⠾⠋⠉⠙⠂⣀⣤⠖  ⡇\n  ⠈⢧⣄⣀⠈⠉⠛⠒⢒⣲⣖⡒⠒⠛⠉⠁⣀⣠⡼\n⠀  ⢸⠀⠈⢇⠀⠀⢠⠏⠀⠀⠹⡄⠀⠀⡾⠁ ⠀⡇\n⠀  ⢸⠀⠀⠸⣄⣠⠟⠀⠀⠀⠀⢳⣄⣠⠇⠀⠀ ⡇\n  ⢀⣼⠤⣄⣀⣀⡀⠀    ❄️⠀⠀⢀⣀⣀⣀ ⡤⣧\n  ⣏⠀⠀⠈⠁⠀⠉⠙⠘⠉⠉⠃⠋⠉⠀⠈⠁  ⠀⣹\n  ⠈⠉⠛⠛⠲⠤⠤⠤⣤⣀⣀⣤⠤⠤⠤⠖⠛⠛⠉⠁\n\n    ꒰ა ⟡ ໒꒱ ₊   生日 快乐   ₊ ꒰ა ⟡ ໒꒱\n       ┆      ⊹ ˗        🤍        ˗ ⊹    ┆\n     🧊 ☁️   ⋆ ┈  ⪧ ✦ ⪦ ‎‎ ┈ ⋆ ☁️ 🧊\n ×      祝 ${boss} 宝宝天天开心     ×\n ◟       ◞      ˗  ˗   🩵   ˗  ˗      ◟       ◞`;
      document.getElementById('bOutput').textContent=t;
    }
    function clearF(){ setVal('bBoss',''); document.getElementById('bOutput').innerHTML='<span class="placeholder-note">尚未生成</span>'; }
    function switchSub(sub,btn){
      document.querySelectorAll('#subBtns .sub-card').forEach(c=>c.classList.remove('active')); btn.classList.add('active');
      if(sub==='girl'){ document.getElementById('secIcon').textContent='🎀'; document.getElementById('secTitle').textContent='生日 · 女宝'; document.getElementById('formContent').innerHTML=formF('🎀 老板姓名'); }

    }
    document.getElementById('formContent').innerHTML=formF('🎀 老板姓名');
  </script>
</body>
